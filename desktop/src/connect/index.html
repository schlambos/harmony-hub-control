<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="color-scheme" content="dark">
  <title>Connect · Melodious</title>
  <link rel="stylesheet" href="/assets/harmony-shell.css">
  <style>
    .setup-entry-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin-top: var(--space-4);
      padding: var(--space-4);
      border-radius: var(--shape-lg);
      background: var(--card);
      border: 1px solid var(--outline-variant);
      text-align: left;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .setup-entry-card:hover:not(:disabled) {
      background: var(--surface-high);
      border-color: var(--primary);
    }
    .setup-wiz-choice {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-4);
      border-radius: var(--shape-lg);
      background: var(--card);
      border: 1.5px solid var(--outline-variant);
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .setup-wiz-choice:hover {
      background: var(--surface-high);
    }
    .setup-wiz-choice.is-selected {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: var(--primary);
    }
    .setup-wiz-choice.is-selected .muted {
      color: var(--on-primary-container);
      opacity: 0.86;
    }
    .setup-wiz-choice input[type="radio"] {
      margin-top: 3px;
      accent-color: var(--primary);
    }
    .setup-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--shape-full);
      font-size: var(--fs-caption);
      font-weight: 600;
      white-space: nowrap;
      background: var(--surface-highest);
      color: var(--on-tile);
    }
    .setup-pill.is-done {
      background: var(--hub-tile);
      color: var(--live);
    }
    .setup-pill.is-warn {
      background: var(--warning-container);
      color: var(--warning);
    }
    .setup-pill.is-err {
      background: var(--power-container);
      color: var(--on-power-container);
    }
    .setup-pill.is-active {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .setup-stage {
      display: grid;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      border-radius: var(--shape-lg);
      background: var(--card);
      border: 1px solid var(--divider);
    }
    .setup-stage.is-current {
      border-color: var(--primary);
    }
    .setup-stage.is-done {
      border-color: #2c4a3d;
    }
    .setup-stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .setup-stage-num {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface-highest);
      color: var(--on-surface);
      font-size: var(--fs-body-sm);
      font-weight: 600;
      flex: none;
    }
    .setup-stage.is-done .setup-stage-num {
      background: var(--hub-tile);
      color: var(--live);
    }
    .setup-stage.is-current .setup-stage-num {
      background: var(--primary);
      color: var(--on-primary);
    }
    .setup-wifi-list {
      display: grid;
      max-height: 200px;
      overflow-y: auto;
      border-radius: var(--shape-md);
      background: var(--surface-lowest);
      border: 1px solid var(--divider);
    }
    .setup-wifi-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      padding: 10px var(--space-3);
      text-align: left;
      font-size: var(--fs-body-sm);
    }
    .setup-wifi-item + .setup-wifi-item {
      border-top: 1px solid var(--divider);
    }
    .setup-wifi-item:hover:not(:disabled) {
      background: var(--state-hover);
    }
    .setup-wifi-item.is-picked {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .setup-log {
      max-height: 180px;
      overflow-y: auto;
      padding: var(--space-3);
      border-radius: var(--shape-sm);
      background: var(--surface-lowest);
      border: 1px solid var(--divider);
      font-family: var(--font-mono);
      font-size: var(--fs-caption);
      line-height: 1.45;
      color: var(--on-surface-variant);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .setup-dev-accordion {
      margin-top: var(--space-5);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--shape-md);
      background: var(--surface-low);
      border: 1px solid var(--divider);
    }
    .setup-dev-accordion > summary {
      cursor: pointer;
      font-size: var(--fs-body-sm);
      font-weight: 500;
      color: var(--on-surface-variant);
      user-select: none;
    }
    .setup-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }
    @media (max-width: 560px) {
      .setup-grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app is-subpage" id="app">
    <header class="appbar" id="connectAppbar" style="margin-left:0" hidden>
      <button type="button" class="icon-btn" id="settingsBackBtn" aria-label="Back">
        <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <h1 class="appbar-title" id="connectAppbarTitle">Settings</h1>
      <div class="appbar-actions" id="connectAppbarActions"></div>
    </header>
    <main id="main" class="main" style="margin-left:0" tabindex="-1">
      <div class="page" id="connectRoot"></div>
    </main>
  </div>
  <div class="snackbar-host" id="snackbars" aria-live="polite"></div>
  <!-- CONNECT_SCRIPT -->
</body>
</html>
