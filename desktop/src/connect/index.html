<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="color-scheme" content="dark">
  <title>Connect · Melodious</title>
  <link rel="stylesheet" href="/assets/harmony-shell.css">
  <style>
    .setup-entry-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin-top: var(--space-4);
      padding: var(--space-4);
      border-radius: var(--shape-lg);
      background: var(--card);
      border: 1px solid var(--outline-variant);
      text-align: left;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .setup-entry-card:hover:not(:disabled) {
      background: var(--surface-high);
      border-color: var(--primary);
    }
    .setup-wiz-shell {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      width: 100%;
      min-height: calc(100dvh - var(--appbar-h) - env(safe-area-inset-top, 0px) - 72px);
      margin: 0 auto;
    }
    .setup-wiz-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .setup-progress-header {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: var(--space-2);
      padding: 0 var(--space-1);
    }
    .setup-progress-step {
      display: grid;
      gap: 6px;
    }
    .setup-progress-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--key-raised);
      transition: background-color 180ms ease;
    }
    .setup-progress-step.is-done .setup-progress-bar,
    .setup-progress-step.is-current .setup-progress-bar {
      background: var(--primary);
    }
    .setup-progress-label {
      font-size: var(--fs-caption);
      color: var(--on-surface-variant);
      font-weight: 500;
    }
    .setup-progress-step.is-current .setup-progress-label {
      color: var(--on-surface);
      font-weight: 600;
    }
    .setup-progress-step.is-done .setup-progress-label {
      color: var(--live);
    }
    .setup-focus-card {
      display: grid;
      gap: var(--space-4);
      padding: var(--space-5);
      border-radius: var(--shape-lg);
      background: var(--card);
      border: 1px solid var(--divider);
    }
    .setup-wiz-choice {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-4);
      border-radius: var(--shape-lg);
      background: var(--surface-low);
      border: 1.5px solid var(--outline-variant);
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .setup-wiz-choice:hover {
      background: var(--surface-high);
    }
    .setup-wiz-choice.is-selected {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: var(--primary);
    }
    .setup-wiz-choice.is-selected .muted {
      color: var(--on-primary-container);
      opacity: 0.88;
    }
    .setup-wiz-choice input[type="radio"] {
      margin-top: 3px;
      accent-color: var(--primary);
    }
    .setup-status-card {
      display: grid;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      border-radius: var(--shape-lg);
      background: var(--card);
      border: 1.5px solid var(--outline-variant);
      margin-top: var(--space-4);
    }
    .setup-status-card.is-ready {
      border-color: #2c5a48;
      background: var(--surface-high);
    }
    .setup-status-card.is-warn {
      border-color: var(--warning);
    }
    .setup-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--shape-full);
      font-size: var(--fs-caption);
      font-weight: 600;
      white-space: nowrap;
      background: var(--surface-highest);
      color: var(--on-tile);
    }
    .setup-pill.is-done {
      background: var(--hub-tile);
      color: var(--live);
    }
    .setup-pill.is-warn {
      background: var(--warning-container);
      color: var(--warning);
    }
    .setup-pill.is-err {
      background: var(--power-container);
      color: var(--on-power-container);
    }
    .setup-pill.is-active {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .setup-disclosure {
      border-radius: var(--shape-md);
    }
    .setup-disclosure > summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: var(--fs-body-sm);
      color: var(--on-surface-variant);
      user-select: none;
      list-style: none;
      padding: 4px 0;
    }
    .setup-disclosure > summary::-webkit-details-marker {
      display: none;
    }
    .setup-disclosure > summary::before {
      content: "▸";
      font-size: 12px;
      transition: transform 140ms ease;
    }
    .setup-disclosure[open] > summary::before {
      transform: rotate(90deg);
    }
    .setup-disclosure > summary:hover {
      color: var(--on-surface);
    }
    .setup-disclosure-body {
      display: grid;
      gap: var(--space-3);
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--divider);
    }
    .setup-wifi-list {
      display: grid;
      max-height: 220px;
      overflow-y: auto;
      border-radius: var(--shape-md);
      background: var(--surface-lowest);
      border: 1px solid var(--divider);
    }
    .setup-wifi-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      padding: 12px var(--space-3);
      text-align: left;
      font-size: var(--fs-body-sm);
    }
    .setup-wifi-item + .setup-wifi-item {
      border-top: 1px solid var(--divider);
    }
    .setup-wifi-item:hover:not(:disabled) {
      background: var(--state-hover);
    }
    button.setup-wifi-item.is-picked {
      background: var(--primary-container);
      color: var(--on-primary-container);
      box-shadow: inset 3px 0 0 var(--primary);
    }
    button.setup-wifi-item.is-picked .muted {
      color: var(--on-primary-container);
      opacity: 0.88;
    }
    .setup-checklist {
      display: grid;
      gap: var(--space-2);
    }
    .setup-check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--shape-md);
      background: var(--surface-low);
      border: 1px solid transparent;
      font-size: var(--fs-body-sm);
      color: var(--on-surface-variant);
    }
    .setup-check-item.is-active {
      color: var(--on-surface);
      font-weight: 500;
      border-color: var(--primary);
      background: var(--surface-high);
    }
    .setup-check-item.is-done {
      color: var(--on-surface);
    }
    .setup-check-item.is-error {
      color: var(--on-surface);
      font-weight: 500;
      border-color: var(--power-container);
      background: var(--surface-high);
    }
    .setup-stage-num {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-highest);
      color: var(--on-surface-variant);
      font-size: var(--fs-caption);
      font-weight: 600;
      flex: none;
    }
    .setup-check-item.is-done .setup-stage-num {
      background: var(--hub-tile);
      color: var(--live);
    }
    .setup-check-item.is-active .setup-stage-num {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .setup-check-item.is-error .setup-stage-num {
      background: var(--power-container);
      color: var(--on-power-container);
    }
    .setup-log {
      max-height: 180px;
      overflow-y: auto;
      padding: var(--space-3);
      border-radius: var(--shape-sm);
      background: var(--surface-lowest);
      border: 1px solid var(--divider);
      font-family: var(--font-mono);
      font-size: var(--fs-caption);
      line-height: 1.45;
      color: var(--on-surface-variant);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .setup-footer-links {
      margin-top: auto;
      padding-top: var(--space-5);
      padding-bottom: var(--space-4);
      display: flex;
      justify-content: center;
    }
    .setup-muted-link {
      background: none;
      border: 0;
      padding: 6px 10px;
      font-size: var(--fs-caption);
      color: var(--on-surface-variant);
      opacity: 0.72;
      cursor: pointer;
      border-radius: var(--shape-sm);
    }
    .setup-muted-link:hover:not(:disabled) {
      opacity: 1;
      color: var(--on-surface);
      text-decoration: underline;
    }
    .setup-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }
    @media (max-width: 560px) {
      .setup-grid-2 {
        grid-template-columns: 1fr;
      }
    }
    /* Status badge beside a row title (User images): apart from the muted
       description below it. */
    .m-status {
      display: inline-block;
      margin-left: var(--space-2);
      padding: 1px 10px;
      border-radius: 999px;
      background: var(--surface-highest);
      color: var(--on-surface-variant);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.6;
      vertical-align: middle;
      white-space: nowrap;
    }
    .m-status--warn {
      background: var(--warning-container);
      color: var(--warning);
    }
    .m-status--ok {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    /* Result of the last action in a row (User images sync): a coloured bar
       and stronger text, apart from the muted description above it. */
    .m-result {
      display: block;
      margin-top: var(--space-1);
      padding-left: var(--space-2);
      border-left: 3px solid var(--primary);
      color: var(--on-surface);
      font-size: 13px;
      font-weight: 500;
    }
    .m-result--warn {
      border-left-color: var(--warning);
      color: var(--warning);
    }
    .m-result--error {
      border-left-color: var(--error);
      color: var(--error);
    }
  </style>
</head>
<body>
  <div class="app is-subpage" id="app">
    <header class="appbar" id="connectAppbar" style="margin-left:0" hidden>
      <button type="button" class="icon-btn" id="settingsBackBtn" aria-label="Back">
        <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <h1 class="appbar-title" id="connectAppbarTitle">Settings</h1>
      <div class="appbar-actions" id="connectAppbarActions"></div>
    </header>
    <main id="main" class="main" style="margin-left:0" tabindex="-1">
      <div class="page" id="connectRoot"></div>
    </main>
  </div>
  <div class="snackbar-host" id="snackbars" aria-live="polite"></div>
  <!-- CONNECT_SCRIPT -->
</body>
</html>
