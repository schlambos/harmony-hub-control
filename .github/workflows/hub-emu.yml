name: Real MIPS backend
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: sh tools/hub-emu/run.sh --pinned
      - run: node tools/hub-emu/hub-update-qa.mjs
      # Start from a clean fixture after the updater deliberately replaces files.
      # qa.mjs is a PR gate since #186 reconciled it with the pinned backend.
      - run: |
          sh tools/hub-emu/run.sh --pinned
          node tools/hub-emu/qa.mjs
